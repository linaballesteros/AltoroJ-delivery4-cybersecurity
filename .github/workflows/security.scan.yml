
name: Fluid Attacks Security Scanning

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================
  # SAST
  # ==========================
  sast:
    name: SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SAST
        id: scan
        uses: fluidattacks/sast-action@1.3.0
        with:
          scanner_mode: full
          scan_config_path: .github/security/sast-config.yaml

      - name: Upload SAST CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: results-sast.csv
          if-no-files-found: error

      - name: Check SAST severity threshold
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import sys

          with open("results-sast.csv", encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              if not reader.fieldnames or "cvss_v4_severity" not in reader.fieldnames:
                  sys.exit("Missing severity column")
              findings = list(reader)

          severe = [
              row for row in findings
              if row["cvss_v4_severity"].strip().lower()
              in ("high", "critical")
          ]

          print(f"Total SAST findings: {len(findings)}")
          print(f"High/Critical findings: {len(severe)}")

          if severe:
              sys.exit("SAST security threshold exceeded")
          PY

  # ==========================
  # SCA
  # ==========================
  sca:
    name: SCA Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SCA
        id: scan
        uses: fluidattacks/sca-action@1.2.0
        with:
          scanner_mode: full
          scan_config_path: .github/security/sca-config.yaml

      - name: Upload SCA CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: results-sca.csv
          if-no-files-found: error

      - name: Check SCA severity threshold
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import sys

          with open("results-sca.csv", encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              if not reader.fieldnames or "cvss_v4_severity" not in reader.fieldnames:
                  sys.exit("Missing severity column")
              findings = list(reader)

          severe = [
              row for row in findings
              if row["cvss_v4_severity"].strip().lower()
              in ("high", "critical")
          ]

          print(f"Total SCA findings: {len(findings)}")
          print(f"High/Critical findings: {len(severe)}")

          if severe:
              sys.exit("SCA security threshold exceeded")
          PY

  # ==========================
  # SECRET SCAN
  # ==========================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Secret Scan
        id: scan
        uses: fluidattacks/ss-action@main
        with:
          scanner_mode: full
          scan_config_path: .github/security/ss-config.yaml

      - name: Upload Secret Scan CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: results-ss.csv
          if-no-files-found: error

      - name: Check secret exposure policy
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import sys

          with open("results-ss.csv", encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              if not reader.fieldnames:
                  sys.exit("Invalid Secret Scan CSV")
              findings = list(reader)

          print(f"Exposed secrets found: {len(findings)}")

          # Security policy:
          # Any exposed secret is considered HIGH priority.
          if findings:
              sys.exit("Secret exposure policy violated")
          PY


name: Fluid Attacks Security Scanning

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  sast:
    name: SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SAST
        id: scan
        uses: fluidattacks/sast-action@1.3.0
        with:
          scanner_mode: full
          scan_config_path: .github/security/sast-config.yaml

      - name: Upload SAST CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: results-sast.csv
          if-no-files-found: error

      - name: Fail if SAST vulnerabilities found
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: |
          echo "SAST detected vulnerabilities."
          echo "Failing pipeline in strict mode."
          exit 1

  sca:
    name: SCA Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SCA
        id: scan
        uses: fluidattacks/sca-action@1.2.0
        with:
          scanner_mode: full
          scan_config_path: .github/security/sca-config.yaml

      - name: Upload SCA CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: results-sca.csv
          if-no-files-found: error

      - name: Fail if SCA vulnerabilities found
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: |
          echo "SCA detected vulnerabilities."
          echo "Failing pipeline in strict mode."
          exit 1

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Secret Scan
        id: scan
        uses: fluidattacks/ss-action@main
        with:
          scanner_mode: full
          scan_config_path: .github/security/ss-config.yaml

      - name: Upload Secret Scan CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: results-ss.csv
          if-no-files-found: error

      - name: Fail if secrets found
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: |
          echo "Secret Scan detected exposed secrets."
          echo "Failing pipeline."
          exit 1
